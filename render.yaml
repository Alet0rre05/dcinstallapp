# Blueprint de Render: backend (Web Service) + frontend (Static Site).
# La base de datos vive en Neon (se configura DATABASE_URL a mano).
services:
  - type: web
    name: dcinstall-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: CONTROL_BLOQUEO_MESES
        value: "6"
      - key: ESCALADA_CONTROL_DIAS
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: EMPRESA_RELEVADORA
        value: DCINSTALL SRL   # va en «Relevado por:» de la planilla de extintores (V3.0)
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # ej: https://dcinstall-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false   # ej: https://dcinstall-api.onrender.com

  - type: web
    name: dcinstall-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # ej: https://dcinstall-api.onrender.com/api
      - key: VITE_PUBLIC_BASE_URL
        sync: false   # dominio DEFINITIVO que va en los QR impresos, sin barra final (ej: https://app.tudominio.com)
      - key: VITE_TURNSTILE_SITE_KEY
        value: 0x4AAAAAAFOl2XYOw3I1H__t
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: dcinstall-escaladas
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 12 * * *"
    startCommand: python manage.py escalar_controles_vencidos
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        fromService:
          type: web
          name: dcinstall-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: dcinstall-api
          envVarKey: DATABASE_URL
      - key: CONTROL_BLOQUEO_MESES
        value: "6"
      - key: ESCALADA_CONTROL_DIAS
        value: "30"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
