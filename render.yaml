# Blueprint de Render: backend (Web Service) + frontend (Static Site).
# La base de datos vive en Neon (se configura DATABASE_URL a mano).
services:
  - type: web
    name: dcinstall-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # ej: https://dcinstall-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false   # ej: https://dcinstall-api.onrender.com

  - type: web
    name: dcinstall-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # ej: https://dcinstall-api.onrender.com/api
      - key: VITE_PUBLIC_BASE_URL
        sync: false   # dominio DEFINITIVO que va en los QR impresos, sin barra final (ej: https://app.tudominio.com)
      - key: VITE_TURNSTILE_SITE_KEY
        value: 0x4AAAAAAFOl2XYOw3I1H__t
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
